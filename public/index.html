<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta
            name="description"
            content="Юридическая помощь военнослужащим, мобилизованным и добровольцам в Липецке"
        />
        <title>Юридическая помощь военнослужащим в Липецке</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        
        <!-- GitHub Pages SPA redirect handler: convert ?/path back to real pathname -->
        <script>
          (function () {
            try {
              var m = window.location.search.match(/^\?\/(.*)/);
              if (m && m[1]) {
                var path = m[1].replace(/~and~/g, '&');
                var base = window.location.pathname.replace(/\/$/, '');
                var target = base + '/' + path;
                window.history.replaceState({}, document.title, target + window.location.hash);
              }
            } catch (e) {
              console.warn('spa-redirect rewrite failed', e);
            }
          })();
        </script>
        
        <div id="root"></div>
    </body>
</html>
