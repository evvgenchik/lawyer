<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Lawyer App</title>
    <script type="text/javascript">
      // SPA redirect for GitHub Pages (rafgraph-style), safe for repo served at /lawyer/
      (function () {
        var pathSegmentsToKeep = 1; // keep "/lawyer"
        var l = window.location;
        var parts = l.pathname.split('/').filter(Boolean); // ['lawyer','admin',...]
        var repoPath = parts.slice(0, pathSegmentsToKeep).join('/');
        var rest = parts.slice(pathSegmentsToKeep).join('/');
        // Build target: /<repoPath>/?/<rest> (or if rest empty, just /<repoPath>/)
        var target = l.protocol + '//' + l.host + '/' + repoPath + '/';
        if (rest) target += '?/' + rest;
        if (l.search) target += (rest ? '&' : '?') + l.search.slice(1).replace(/&/g, '~and~');
        target += l.hash || '';
        l.replace(target);
      }());
    </script>
  </head>
  <body></body>
</html>
