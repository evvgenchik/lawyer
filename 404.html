<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Lawyer App</title>
        <script>
          // If 404.html redirected to "/<repo>/?/some/path", convert "?/some/path" into pathname
          (function () {
            try {
              var m = window.location.search.match(/^\?\/(.*)/);
              if (m && m[1]) {
                var path = m[1].replace(/~and~/g, '&');
                // keep base pathname (e.g. /lawyer) and append the real path
                var base = window.location.pathname.replace(/\/$/, '');
                var target = base + '/' + path;
                // replace history so Router sees the correct pathname
                window.history.replaceState({}, document.title, target + window.location.hash);
              }
            } catch (e) {
              // fail silently
              console.warn('spa-redirect rewrite failed', e);
            }
          })();
        </script>
  </head>
  <body></body>
</html>
